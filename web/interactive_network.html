<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>İstanbul Raylı Sistem Ağı</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2f6;--pan:#fff;--ink:#0d1b2a;--mut:#5b6b7d;--line:#d5dde6;--acc:#0057b8;--hi:#ffb703;--cv:#f7f9fb}
[data-t=dark]{--bg:#0a111c;--pan:#121c2b;--ink:#e8eef6;--mut:#8fa1b6;--line:#243247;--acc:#5aa2ff;--hi:#ffb703;--cv:#0d1624}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Public Sans",Segoe UI,Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px;background:var(--pan);border-bottom:1px solid var(--line)}
h1{font-size:21px;font-weight:800;margin:0}header p{margin:2px 0 0;color:var(--mut);font-size:12.5px}
.hb{display:flex;gap:8px}button,select,input{font:inherit;color:var(--ink);background:var(--pan);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
button{cursor:pointer;font-weight:600}button:hover{border-color:var(--acc)}button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
:focus-visible{outline:2px solid var(--hi);outline-offset:1px}
#stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.st{background:var(--pan);padding:8px 16px}.st b{display:block;font-size:20px;font-weight:800}.st span{color:var(--mut);font-size:12px}
main{display:grid;grid-template-columns:290px 1fr 320px;height:calc(100vh - 128px);min-height:560px}
aside{background:var(--pan);overflow:auto;padding:14px;border-right:1px solid var(--line)}aside#r{border-right:0;border-left:1px solid var(--line)}
#net{background:var(--cv);position:relative}#cy{position:absolute;inset:0}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 4px}
aside select,aside input{width:100%}.row{display:flex;gap:6px;margin-top:10px}.row button{flex:1}
#sug{position:relative}#sug div{position:absolute;z-index:5;left:0;right:0;background:var(--pan);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 20px #0003;max-height:220px;overflow:auto}
#sug a{display:block;padding:7px 10px;cursor:pointer}#sug a:hover{background:var(--bg)}
h3{font-size:14px;margin:18px 0 6px}table{width:100%;border-collapse:collapse;font-size:12.5px}td{padding:3px 0;border-bottom:1px solid var(--line)}td:last-child{text-align:right;color:var(--mut)}
td a{cursor:pointer;color:var(--acc)}.chip{display:inline-block;padding:1px 8px;border-radius:99px;color:#fff;font-size:11.5px;font-weight:700;margin:0 4px 4px 0}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:8px 0}.kv span{color:var(--mut)}.kv b{text-align:right}
.note{font-size:12px;color:var(--mut);background:var(--bg);border-left:3px solid var(--hi);padding:8px 10px;margin-top:14px;border-radius:0 6px 6px 0}
.res{background:var(--bg);border-radius:8px;padding:10px;margin-top:8px;font-size:13px}.nb a{cursor:pointer;color:var(--acc);margin-right:8px;white-space:nowrap}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:4px 9px;border-radius:5px;font-size:12px;display:none;z-index:9}
#leg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;margin-top:6px}#leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
#drop{position:absolute;inset:0;display:none;place-items:center;text-align:center;background:var(--cv);z-index:4}#drop div{border:2px dashed var(--acc);border-radius:14px;padding:36px 44px;max-width:420px}
canvas{width:100%;height:200px;display:block}
@media(max-width:1000px){main{grid-template-columns:1fr;height:auto}#net{height:70vh}aside{border:0}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
</head><body>
<header><div><h1 id="h1"></h1><p id="sub"></p></div><div class="hb"><button id="lang">EN</button><button id="theme">◐</button></div></header>
<div id="stats"></div>
<main>
<aside id="l">
 <label id="lSearch"></label><div id="sug"><input id="q" autocomplete="off"><div id="sl" hidden></div></div>
 <label id="lComm"></label><select id="comm"></select>
 <label id="lLine"></label><select id="line"></select>
 <label id="lColor"></label><select id="color"></select>
 <label id="lLay"></label><select id="lay"></select>
 <div class="row"><button id="reset"></button><button id="png"></button></div>
 <div id="leg"></div>
 <h3 id="tScat"></h3><canvas id="sc"></canvas><div class="note" id="scn"></div>
 <h3 id="tPax"></h3><table id="tp"></table>
 <h3 id="tBc"></h3><table id="tb"></table>
</aside>
<div id="net"><div id="cy"></div>
 <div id="drop"><div><h2 id="dh"></h2><p id="dp"></p><input type="file" id="file" accept=".json"></div></div></div>
<aside id="r"><div id="det"></div><div class="note" id="note"></div></aside>
</main><div id="tip"></div>
<script>
const EMBEDDED=/*__DATA__*/null;
const T={tr:{h1:"İstanbul Raylı Sistem Ağı",sub:"2025 İBB istasyon verisi ve resmî hat sıralarıyla kurulan istasyon ağı",s:"İstasyon ara",ph:"Örn. Yenikapı, Sirkeci",c:"Topluluk",all:"Tümü",ln:"Hat",col:"Renklendirme",byC:"Topluluğa göre",byL:"Ana hatta göre",lay:"Yerleşim",reset:"Sıfırla",png:"PNG indir",tScat:"Merkezi istasyon aynı zamanda kalabalık mı?",scn:"Yatay: betweenness (topolojik), dikey: günlük ortalama yolcu. Noktalar topluluk rengindedir.",tPax:"En kalabalık 10 istasyon",tBc:"En merkezi 10 istasyon (betweenness)",nodes:"İstasyon",edges:"Bağlantı",dens:"Yoğunluk",comp:"Bileşen",deg:"Ort. derece",comm:"Topluluk",rho:"Spearman ρ",click:"Bir istasyona tıkla",clickp:"Ayrıntılar, komşular ve kapanma simülasyonu burada görünür.",lines:"Hatlar",pax:"Günlük ort. yolcu",nopax:"Veri yok",d:"Derece",bc:"Betweenness",rank:"Yolcu sırası",neigh:"Komşu istasyonlar",close:"Bu istasyonu kapat",open:"Kapanışı geri al",before:"Önce",after:"Sonra",cmp:"Bileşen sayısı",big:"En büyük bileşen",avg:"Ort. en kısa yol",cut:"Ağdan kopan istasyon",note:"Kenar ağırlığı iki uç istasyonun ortalama yolcusundan türetilen vekil ölçüdür; gözlenmiş yolcu akışı değildir. Kapanma simülasyonu topolojiktir.",dh:"Ağ verisi bulunamadı",dp:"graph_elements.json dosyasını buraya seç veya sayfayı verinin gömülü olduğu sürümle yeniden oluştur.",tr:"Aktarma"},
en:{h1:"Istanbul Rail Network",sub:"Station network built from 2025 IBB station data and official line orders",s:"Search station",ph:"e.g. Yenikapı, Sirkeci",c:"Community",all:"All",ln:"Line",col:"Colour by",byC:"Community",byL:"Main line",lay:"Layout",reset:"Reset",png:"Download PNG",tScat:"Are central stations also the busiest?",scn:"X: betweenness (topological), Y: mean daily passengers. Dots use community colours.",tPax:"10 busiest stations",tBc:"10 most central stations (betweenness)",nodes:"Stations",edges:"Links",dens:"Density",comp:"Components",deg:"Avg degree",comm:"Communities",rho:"Spearman ρ",click:"Click a station",clickp:"Details, neighbours and the closure simulation appear here.",lines:"Lines",pax:"Mean daily passengers",nopax:"No data",d:"Degree",bc:"Betweenness",rank:"Passenger rank",neigh:"Neighbouring stations",close:"Close this station",open:"Undo closure",before:"Before",after:"After",cmp:"Components",big:"Largest component",avg:"Avg shortest path",cut:"Stations cut off",note:"Edge weight is a proxy derived from the mean daily passengers of both end stations, not observed passenger flow. The closure simulation is topological.",dh:"No network data found",dp:"Pick graph_elements.json here or rebuild the page with the data embedded.",tr:"Transfer"}};
const LC={M1A:'#e30613',M1B:'#e30613',M2:'#00a651',M3:'#00aeef',M4:'#e91e8c',M5:'#7b3f98',M6:'#a1887f',M7:'#f48fb1',M8:'#00a0a0',M9:'#fbc02d',M11:'#8e44ad',T1:'#1565c0',T3:'#ff9800',T4:'#ef6c00',T5:'#00897b',F1:'#6d4c41',F4:'#546e7a',MAR:'#1976d2',SIRKECI:'#1976d2'};
const PAL=['#2a9d8f','#e76f51','#264653','#e9c46a','#8e44ad','#3a86ff','#d62828','#52b788','#fb8500','#9d4edd','#00b4d8','#a8a29e','#ef476f','#06d6a0','#7f5539','#4361ee','#b5179e','#80b918','#f72585','#118ab2'];
const $=id=>document.getElementById(id),nz=s=>String(s).toLocaleLowerCase('tr-TR').replace(/ı/g,'i').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
let lang='tr',cy,base,sel=null,closed=null,cc=new Map(),dark=false;
const t=k=>T[lang][k]||k,fmt=n=>Math.round(n).toLocaleString(lang==='tr'?'tr-TR':'en-US'),cm=n=>n.data('_cm'),
 colOf=c=>cc.get(String(c))||'#8a99ab',lcol=l=>LC[l]||PAL[[...String(l)].reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length];
function rk(a){const ix=a.map((v,i)=>[v,i]).sort((x,y)=>x[0]-y[0]),r=Array(a.length);for(let i=0;i<ix.length;){let j=i;while(j+1<ix.length&&ix[j+1][0]===ix[i][0])j++;for(let k=i;k<=j;k++)r[ix[k][1]]=(i+j)/2+1;i=j+1}return r}
function pear(x,y){const n=x.length,mx=x.reduce((a,b)=>a+b)/n,my=y.reduce((a,b)=>a+b)/n;let s=0,a=0,b=0;for(let i=0;i<n;i++){s+=(x[i]-mx)*(y[i]-my);a+=(x[i]-mx)**2;b+=(y[i]-my)**2}return s/Math.sqrt(a*b)}
function sim(skip){const ids=cy.nodes().map(n=>n.id()).filter(i=>i!==skip),adj=new Map(ids.map(i=>[i,[]]));
 cy.edges().forEach(e=>{const s=e.source().id(),u=e.target().id();if(s===skip||u===skip)return;adj.get(s).push(u);adj.get(u).push(s)});
 const seen=new Set(),cs=[];ids.forEach(i=>{if(seen.has(i))return;const c=[i];seen.add(i);for(let q=0;q<c.length;q++)adj.get(c[q]).forEach(w=>{if(!seen.has(w)){seen.add(w);c.push(w)}});cs.push(c)});
 cs.sort((a,b)=>b.length-a.length);const big=cs[0];let tot=0,cnt=0;
 big.forEach(s=>{const d=new Map([[s,0]]),q=[s];for(let i=0;i<q.length;i++)adj.get(q[i]).forEach(w=>{if(!d.has(w)){d.set(w,d.get(q[i])+1);q.push(w)}});d.forEach(v=>tot+=v);cnt+=big.length-1});
 return{comps:cs.length,big:big.length,avg:cnt?tot/cnt:0,cut:ids.length-big.length}}
function show(id,v){$(id).style.display=v?'':'none'}
async function boot(){let d=EMBEDDED;
 if(!d)try{const r=await fetch('graph_elements.json');if(r.ok)d=await r.json()}catch(e){}
 if(!d){$('drop').style.display='grid';$('file').onchange=async e=>{const x=JSON.parse(await e.target.files[0].text());$('drop').style.display='none';init(x)};ui();return}
 init(d)}
function init(d){const ns=(Array.isArray(d)?d.filter(e=>!e.data.source):d.nodes).map(n=>n),es=Array.isArray(d)?d.filter(e=>e.data.source):d.edges;
 cy=cytoscape({container:$('cy'),elements:{nodes:ns,edges:es},minZoom:.15,maxZoom:6,wheelSensitivity:.25,
  style:[{selector:'node',style:{label:'data(label)','font-size':8,'min-zoomed-font-size':8,'text-valign':'bottom','text-margin-y':2,'text-wrap':'wrap','text-max-width':90,width:'data(_s)',height:'data(_s)','background-color':'data(_c)','border-width':1,'border-color':'#fff'}},
   {selector:'node[?_nodata]',style:{'border-style':'dashed','border-color':'#8a99ab','background-opacity':.55}},
   {selector:'edge',style:{width:'data(_w)','line-color':'#8ea2b8',opacity:.5,'curve-style':'bezier'}},
   {selector:'edge[?_tr]',style:{'line-style':'dashed','line-color':'#ffb703',opacity:.9}},
   {selector:'.faded',style:{opacity:.07,'text-opacity':.05}},{selector:'.nb',style:{'border-width':3,'border-color':'#ffb703'}},
   {selector:'node:selected',style:{'border-width':5,'border-color':'#ffb703'}},{selector:'.closed',style:{opacity:.25,'background-color':'#d62828'}},{selector:'.hit',style:{'border-width':5,'border-color':'#ffb703'}}]});
 const pax=n=>+n.data('passenger_mean_daily')||0,mx=Math.max(...cy.nodes().map(pax),1),sm=Math.max(...es.map(e=>+e.data.strength||0),1);
 const bc=cy.elements().bc({directed:false}),bcn=cy.nodes().map(n=>bc.betweenness(n));
 cy.nodes().forEach((n,i)=>{const dd=n.data(),c=dd.community??dd.community_louvain??dd.leiden_community??0;
  n.data({_comm:String(c),_cm:{pax:pax(n),bc:bcn[i],deg:n.degree()},_main:String(dd.lines||'').split(',')[0].trim(),_nodata:!(pax(n)>0),_s:8+34*Math.sqrt(pax(n)/mx)});});
 cy.edges().forEach(e=>{const dd=e.data();e.data({_w:.6+3.2*Math.sqrt((+dd.strength||0)/sm),_tr:/transfer|aktarma/i.test(String(dd.kind||dd.type||dd.edge_type||''))||dd.transfer===true})});
 [...new Set(cy.nodes().map(n=>n.data('_comm')))].sort((a,b)=>a-b).forEach((c,i)=>cc.set(c,PAL[i%PAL.length]));
 base=sim(null);window.PAX=pax;ui();recolor();layout();
 cy.on('tap','node',e=>pick(e.target));cy.on('tap',e=>{if(e.target===cy)clear()});
 cy.on('mouseover','node',e=>{const n=e.target,tp=$('tip');tp.textContent=n.data('label')+' - '+(n.data('_nodata')?t('nopax'):fmt(pax(n)));tp.style.display='block'});
 cy.on('mousemove',e=>{const o=e.originalEvent,tp=$('tip');tp.style.left=o.clientX+14+'px';tp.style.top=o.clientY+14+'px'});cy.on('mouseout','node',()=>$('tip').style.display='none')}
function recolor(){const m=$('color').value;cy.nodes().forEach(n=>n.data('_c',m==='line'?lcol(n.data('_main')):colOf(n.data('_comm'))));
 const used=m==='line'?[...new Set(cy.nodes().map(n=>n.data('_main')))].sort():[...cc.keys()];
 $('leg').innerHTML=used.map(u=>`<span><i style="background:${m==='line'?lcol(u):colOf(u)}"></i>${m==='line'?u:'#'+u}</span>`).join('');
 cy.style().selector('node').style('color',dark?'#cfe0f3':'#1b2a3a').update();scatter()}
function layout(){const n=$('lay').value,o={name:n,animate:false,fit:true,padding:30};
 if(n==='cose'){Object.assign(o,{idealEdgeLength:60,nodeRepulsion:9000,numIter:1500,randomize:true})}
 if(n==='concentric')o.concentric=x=>x.degree();if(n==='breadthfirst')o.roots=sel?[sel.id()]:undefined;cy.layout(o).run()}
function filter(){const c=$('comm').value,l=$('line').value;cy.elements().removeClass('faded');
 cy.nodes().forEach(n=>{const ok=(c==='all'||n.data('_comm')===c)&&(l==='all'||String(n.data('lines')||'').split(',').map(s=>s.trim()).includes(l));if(!ok)n.addClass('faded')});
 cy.edges().forEach(e=>{if(e.source().hasClass('faded')||e.target().hasClass('faded'))e.addClass('faded')})}
function clear(){sel=null;cy.elements().removeClass('nb hit');cy.nodes().unselect();$('det').innerHTML=`<h2>${t('click')}</h2><p style="color:var(--mut)">${t('clickp')}</p>`}
function pick(n,zoom){sel=n;cy.elements().removeClass('nb hit');n.select();n.neighborhood('node').addClass('nb');if(zoom)cy.animate({center:{eles:n},zoom:2},{duration:450});detail(n)}
function detail(n){const d=n.data(),m=cm(n),ls=String(d.lines||'').split(',').map(s=>s.trim()).filter(Boolean),all=cy.nodes().map(x=>cm(x).pax),r=1+all.filter(v=>v>m.pax).length,
 sk=['id','label','lines','passenger_mean_daily','has_passenger_data','community','_comm','_cm','_main','_nodata','_s','_c','x','y'],ex=Object.entries(d).filter(([k,v])=>!sk.includes(k)&&!k.startsWith('_')&&typeof v!=='object'&&v!=='').slice(0,8);
 const nb=n.neighborhood('node').map(x=>`<a data-id="${x.id()}">${x.data('label')}</a>`).join('');
 let res='';if(closed===n.id()){const a=sim(n.id());res=`<div class="res"><div class="kv"><span>${t('cmp')}</span><b>${base.comps} → ${a.comps}</b><span>${t('big')}</span><b>${base.big} → ${a.big}</b><span>${t('avg')}</span><b>${base.avg.toFixed(2)} → ${a.avg.toFixed(2)} (${(100*(a.avg/base.avg-1)).toFixed(1)}%)</b><span>${t('cut')}</span><b>${a.cut}</b></div></div>`}
 $('det').innerHTML=`<h2 style="margin:0 0 6px">${d.label}</h2>${ls.map(l=>`<span class="chip" style="background:${lcol(l)}">${l}</span>`).join('')}
 <div class="kv"><span>${t('pax')}</span><b>${m.pax>0?fmt(m.pax):t('nopax')}</b><span>${t('rank')}</span><b>${m.pax>0?r+' / '+all.filter(v=>v>0).length:'-'}</b><span>${t('d')}</span><b>${m.deg}</b><span>${t('bc')}</span><b>${m.bc.toFixed(1)}</b><span>${t('c')}</span><b style="color:${colOf(d._comm)}">#${d._comm}</b>${ex.map(([k,v])=>`<span>${k}</span><b>${typeof v==='number'?(+v.toFixed(4)):v}</b>`).join('')}</div>
 <button class="p" id="cl" style="width:100%">${closed===n.id()?t('open'):t('close')}</button>${res}<h3>${t('neigh')}</h3><div class="nb">${nb}</div>`;
 $('cl').onclick=()=>{cy.nodes().removeClass('closed');closed=closed===n.id()?null:n.id();if(closed)n.addClass('closed');detail(n)};
 document.querySelectorAll('.nb a').forEach(a=>a.onclick=()=>pick(cy.getElementById(a.dataset.id),true))}
function tables(){const tb=(id,key)=>{$(id).innerHTML=cy.nodes().sort((a,b)=>cm(b)[key]-cm(a)[key]).slice(0,10).map((n,i)=>`<tr><td>${i+1}. <a data-id="${n.id()}">${n.data('label')}</a></td><td>${key==='pax'?fmt(cm(n).pax):cm(n).bc.toFixed(0)}</td></tr>`).join('');
  $(id).querySelectorAll('a').forEach(a=>a.onclick=()=>pick(cy.getElementById(a.dataset.id),true))};tb('tp','pax');tb('tb','bc')}
function scatter(){if(!cy)return;const c=$('sc'),w=c.width=c.clientWidth*2,h=c.height=400,x=c.getContext('2d'),ns=cy.nodes().filter(n=>cm(n).pax>0),
 bm=Math.max(...ns.map(n=>cm(n).bc),1),pm=Math.max(...ns.map(n=>cm(n).pax),1),mut=getComputedStyle(document.body).getPropertyValue('--mut');x.clearRect(0,0,w,h);x.strokeStyle=mut;x.fillStyle=mut;x.font='20px sans-serif';
 x.beginPath();x.moveTo(40,10);x.lineTo(40,h-30);x.lineTo(w-10,h-30);x.stroke();x.fillText('betweenness →',w-190,h-8);x.fillText('↑ '+t('pax').split(' ')[0],48,24);
 ns.forEach(n=>{const px=40+(w-60)*cm(n).bc/bm,py=h-30-(h-50)*cm(n).pax/pm;x.beginPath();x.arc(px,py,6,0,7);x.fillStyle=colOf(n.data('_comm'))+'cc';x.fill()})}
function stats(){const n=cy.nodes().length,m=cy.edges().length,ns=cy.nodes().filter(x=>cm(x).pax>0),rho=pear(rk(ns.map(x=>cm(x).bc)),rk(ns.map(x=>cm(x).pax)));
 $('stats').innerHTML=[[t('nodes'),n],[t('edges'),m],[t('dens'),(2*m/(n*(n-1))).toFixed(4)],[t('comp'),base.comps],[t('deg'),(2*m/n).toFixed(2)],[t('comm'),cc.size],[t('rho'),rho.toFixed(2)]].map(([a,b])=>`<div class="st"><b>${b}</b><span>${a}</span></div>`).join('')}
function fill(id,items,keep){const s=$(id),v=s.value;s.innerHTML=items.map(([a,b])=>`<option value="${a}">${b}</option>`).join('');if(keep&&[...s.options].some(o=>o.value===v))s.value=v}
function ui(){document.documentElement.lang=lang;document.body.dataset.t=dark?'dark':'light';const g=(i,k)=>$(i).textContent=t(k);
 g('h1','h1');g('sub','sub');g('lSearch','s');g('lComm','c');g('lLine','ln');g('lColor','col');g('lLay','lay');g('reset','reset');g('png','png');g('tScat','tScat');g('scn','scn');g('tPax','tPax');g('tBc','tBc');g('note','note');g('dh','dh');g('dp','dp');
 $('q').placeholder=t('ph');$('lang').textContent=lang==='tr'?'EN':'TR';
 fill('color',[['comm',t('byC')],['line',t('byL')]],1);fill('lay',[['cose','Force (CoSE)'],['concentric',lang==='tr'?'Dereceye göre halka':'Degree rings'],['circle',lang==='tr'?'Daire':'Circle'],['breadthfirst',lang==='tr'?'Ağaç':'Tree'],['grid',lang==='tr'?'Izgara':'Grid']],1);
 if(cy){fill('comm',[['all',t('all')],...[...cc.keys()].sort((a,b)=>a-b).map(c=>[c,'#'+c])],1);
  const ls=[...new Set(cy.nodes().flatMap(n=>String(n.data('lines')||'').split(',').map(s=>s.trim()).filter(Boolean)))].sort();fill('line',[['all',t('all')],...ls.map(l=>[l,l])],1);stats();tables();recolor();if(sel)detail(sel);else clear()}}
$('lang').onclick=()=>{lang=lang==='tr'?'en':'tr';ui()};$('theme').onclick=()=>{dark=!dark;ui()};
